name: Pixoo Weather GIF
version: "1.3.0"
slug: pixoo_weather_gif
description: Live animated 64x64 weather GIF for the Divoom Pixoo 64
url: https://github.com/kpkramer-netizen/pixoo-weather-gif
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:weather-partly-cloudy
panel_title: Pixoo Weather
watchdog: "tcp://[HOST]:[PORT:6943]"
ports:
  6943/tcp: 6943
ports_description:
  6943/tcp: Web server for the weather GIF
options:
  forecast_entity: ""
  alerts_entity: ""
  show_smiley: false
  precip_threshold: 10
  reading: humidity
  clock_format: 12h
  date_format: month_day
  alert_style: blink
schema:
  forecast_entity: str?
  alerts_entity: str?
  show_smiley: bool?
  precip_threshold: int(1,100)?
  reading: list(humidity|feels_like)?
  clock_format: list(12h|24h)?
  date_format: list(month_day|day_month)?
  alert_style: list(blink|solid)?
