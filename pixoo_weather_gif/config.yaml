name: Pixoo Weather GIF
version: "1.1.0"
slug: pixoo_weather_gif
description: Live animated 64x64 weather GIF for the Divoom Pixoo 64
url: https://github.com/kpkramer-netizen/pixoo-weather-gif
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
watchdog: "tcp://[HOST]:[PORT:6943]"
ports:
  6943/tcp: 6943
ports_description:
  6943/tcp: Web server for the weather GIF
options:
  forecast_entity: weather.pirate_weather
  alerts_entity: sensor.pirate_weather_alerts
schema:
  forecast_entity: str
  alerts_entity: str?
