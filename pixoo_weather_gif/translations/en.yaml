    description: Starting value only. A value saved on the settings page takes priority.
  reading:
    name: Reading under the temperature
    description: Starting value only. A value saved on the settings page takes priority.
  clock_format:
    name: Clock
    description: Starting value only. A value saved on the settings page takes priority.
  date_format:
    name: Date
    description: Starting value only. A value saved on the settings page takes priority.
  alert_style:
    name: Alert icon
    description: Starting value only. A value saved on the settings page takes priority.
network:
  6943/tcp: Web server for the weather GIF
